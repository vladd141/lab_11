
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розбий блоки для ІПЗ!</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <h1>Лабораторна робота для ІПЗ</h1>

  <button id="rules-btn" class="btn rules-btn">
    Показати правила гри
  </button>

  <div id="rules" class="rules">
    <h2>Як грати:</h2>
    <p>
      Використовуй ліву та праву стрілки клавіатури,
      щоб рухати платформу й відбивати м'яч.
    </p>
    <p>
      Якщо втратиш м'яч, рахунок обнулиться,
      а блоки відновляться.
    </p>
    <button id="close-btn" class="btn">Закрити</button>
  </div>

  <canvas id="canvas" width="800" height="600"></canvas>

  <script src="../app/index.js"></script>
</body>
</html>
